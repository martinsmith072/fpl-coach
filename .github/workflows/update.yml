name: Update FPL Coach

on:
  workflow_dispatch: {}          # the "Run workflow" button = refresh signals + advice
  schedule:
    - cron: "17 6 * * *"         # every morning
    - cron: "41 17 * * 5"        # Friday evening, after the press conferences
    - cron: "23 7 * * 6"         # Saturday morning, before a typical deadline
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID || '633619' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build dashboard
        run: python3 build_site.py --out site --prev-snapshot-url "${{ steps.pages.outputs.base_url }}/data/signals_snapshot.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
